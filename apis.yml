aid: lavender
name: Lavender
description: 'Lavender is an AI email intelligence company for sales teams. Its Email Coach is a browser
  extension and Outlook add-in that scores and coaches outbound sales email in real time — subject line,
  structure, tone, length and personalization — using models trained on billions of sales emails, and its
  newer product Ora is an AI sales agent that drafts email and pushes reasoned prospect research into
  Salesforce CRM records. Lavender is distributed as an end-user extension and a Salesforce integration
  rather than as a public developer API: as of this profile the company publishes no developer portal,
  no API reference, no OpenAPI definition, and no client SDKs. It is SOC 2 Type 2 certified and GDPR
  compliant. Lavender is backed by Norwest Venture Partners.'
