    a Salesforce integration — and exposes no developer surface at all: contract
    discovery across www, api, app, dashboard and docs subdomains found no OpenAPI,
    GraphQL, MCP or agent card, and docs.lavender.ai is a dangling Stoplight host
    (CNAME ingress.stoplight.io) that Cloudflare answers with error 1014.
