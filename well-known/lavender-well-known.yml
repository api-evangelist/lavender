  IMPORTANT — SOFT-200 WARNING: app.lavender.ai and dashboard.lavender.ai answer
  HTTP 200 with content-type text/html for EVERY path probed, including
  /.well-known/agent-card.json and /openapi.json. These are single-page-app
  catch-alls returning the Lavender web app shell (`<!doctype html>` … "Lavender is
  an Email Assistant…"), not documents. They are recorded as `soft_200: true` /
  `document: false` and treated as misses. A future round that trusts the status
  code alone would fabricate an agent card and an OpenAPI for this company.
  docs.lavender.ai is a dangling Stoplight host: it CNAMEs to ingress.stoplight.io
  and Cloudflare returns `error code: 1014` (CNAME cross-user banned) with HTTP 403
  on every path, so the API documentation Lavender provisioned there is unreachable.
